plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    if (project.use_rei.toBoolean()) {
        modImplementation "me.shedaniel:RoughlyEnoughItems-fabric:$rei_version"
        modImplementation "me.shedaniel.cloth:cloth-config-fabric:$cloth_config_version"
        modImplementation "dev.architectury:architectury-fabric:$architectury_version"
    }

    //https://maven.quiltmc.org/repository/release/org/quiltmc/parsers/gson/0.2.1/



    if (!project.use_backup.toBoolean()) {
        implementation("org.quiltmc.parsers:gson:0.2.1") { transitive false }
        modImplementation("com.github.apace100:origins-fabric:${origins_version}") { transitive false }
        modImplementation ("com.github.apace100:apoli:$apoli_version") { transitive false }
        modImplementation ("com.github.apace100:calio:$calio_version") { transitive false }
    } else {
        modImplementation "curse.maven:origins-391943:5777233"
    }

    modImplementation "software.bernie.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"

}

loom {
    def aw = file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
