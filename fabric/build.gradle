plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
    id "com.modrinth.minotaur"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    if (project.use_rei.toBoolean()) {
        modImplementation "me.shedaniel:RoughlyEnoughItems-fabric:$rei_version"
        modImplementation "me.shedaniel.cloth:cloth-config-fabric:$cloth_config_version"
        modImplementation "dev.architectury:architectury-fabric:$architectury_version"
    }

    //https://maven.quiltmc.org/repository/release/org/quiltmc/parsers/gson/0.2.1/

    // Additional Entity Attributes
    modImplementation include("maven.modrinth:AdditionalEntityAttributes:${aea_version}-fabric")

    modImplementation("io.github.apace100:apoli:${apoli_fabric_version}")
    modImplementation "io.github.apace100:origins-fabric:${origins_fabric_version}"

    modImplementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}")


    modImplementation "software.bernie.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"

}

loom {
    def aw = file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
